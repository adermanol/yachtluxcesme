<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kahkaha — Çeşme'de Jakuzili Tekne Kiralama | YachtLux Çeşme</title>
  <meta
    name="description"
    content="Kahkaha ile Çeşme'de özel tekne kiralama. Güvertede jakuzi, gün batımı turu, aile ve arkadaş grupları için günlük kiralama."
  />
  <link rel="alternate" hreflang="tr" href="https://yachtluxcesme.com/" />
  <link rel="alternate" hreflang="en" href="https://yachtluxcesme.com/en/" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon-180.png" />

  <link
    rel="preload"
    as="image"
    href="/assets/images/hero-kahkaha-1200.webp"
    fetchpriority="high"
  />
  <link
    rel="preload"
    as="font"
    href="/assets/fonts/bodoni-moda-latin-ext.woff2"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    as="font"
    href="/assets/fonts/dm-sans-latin-ext.woff2"
    type="font/woff2"
    crossorigin
  />

  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/sections.css" />
</head>
<body>
  <section class="hero">
    <div class="hero__media sweep-mask reveal">
      <picture>
        <source
          type="image/webp"
          srcset="
            /assets/images/hero-kahkaha-480.webp   480w,
            /assets/images/hero-kahkaha-800.webp   800w,
            /assets/images/hero-kahkaha-1200.webp 1200w,
            /assets/images/hero-kahkaha-1448.webp 1448w
          "
          sizes="100vw"
        />
        <img
          src="/assets/images/hero-kahkaha-1200.jpg"
          srcset="
            /assets/images/hero-kahkaha-480.jpg   480w,
            /assets/images/hero-kahkaha-800.jpg   800w,
            /assets/images/hero-kahkaha-1200.jpg 1200w,
            /assets/images/hero-kahkaha-1448.jpg 1448w
          "
          sizes="100vw"
          alt="Kahkaha teknesi, Çeşme koyunda demirli, güneşli bir günde"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <div class="hero__scrim"></div>
    </div>

    <header class="container hero__header">
      <img
        class="hero__logo"
        src="/assets/images/logo-yachtlux-header.webp"
        alt="YachtLux Çeşme"
        width="105"
        height="100"
        decoding="async"
      />
    </header>

    <div class="container hero__content">
      <p class="label hero__eyebrow reveal">KAHKAHA · ÇEŞME · 2026</p>

      <h1 class="display hero__title reveal">
        Ege&rsquo;de <em>bir</em> gün, unutulmayan bir akşam
      </h1>

      <p class="body-text hero__lede reveal">
        Kahkaha ile Çeşme koylarında özel bir gün geçirin — güvertesinde
        jakuzisi, gün batımında ışıklarıyla. Aile, çift ya da arkadaş
        grubunuz için.
      </p>

      <div class="hero__actions reveal">
        <button class="btn-cta" type="button" data-action="open-request-form">
          Tarih Sor
        </button>
      </div>

      <div class="hero__meta reveal-stagger">
        <span class="hero__meta-item"><strong>8</strong> kişi kapasite</span>
        <span class="hero__meta-item"><strong>Jakuzi</strong> güvertede</span>
        <span class="hero__meta-item">Çeşme&rsquo;den kalkış</span>
      </div>
    </div>
  </section>

  <script src="/js/motion.js"></script>
</body>
</html>
